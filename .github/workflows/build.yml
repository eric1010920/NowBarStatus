name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NowBarStatus-source.zip
      - name: Patch promoted ongoing flag
        run: |
          sed -i 's|b.setRequestPromotedOngoing(true);|android.os.Bundle ex = new android.os.Bundle(); ex.putBoolean("android.requestPromotedOngoing", true); b.addExtras(ex);|' NowBarStatus/app/src/main/java/app/pocketstatus/nowbar/NowBarService.java
          grep -n "requestPromotedOngoing" NowBarStatus/app/src/main/java/app/pocketstatus/nowbar/NowBarService.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug
        working-directory: NowBarStatus
      - uses: actions/upload-artifact@v4
        with:
          name: NowBarStatus-apk
          path: NowBarStatus/app/build/outputs/apk/debug/app-debug.apk
