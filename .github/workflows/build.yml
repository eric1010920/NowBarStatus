name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NowBarStatus-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug
        working-directory: NowBarStatus
      - uses: actions/upload-artifact@v4
        with:
          name: NowBarStatus-apk
          path: NowBarStatus/app/build/outputs/apk/debug/app-debug.apk
